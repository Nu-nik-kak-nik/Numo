name: Release Flatpak

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  flatpak:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: numo-${{ github.event.release.tag_name }}-${{ matrix.arch }}.flatpak
          manifest-path: io.github.Nu_nik_kak_nik.Numo.json
          arch: ${{ matrix.arch }}

      - name: Upload Flatpak to Release
        uses: softprops/action-gh-release@v2
        with:
          files: numo-${{ github.event.release.tag_name }}-${{ matrix.arch }}.flatpak
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}